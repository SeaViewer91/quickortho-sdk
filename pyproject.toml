[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickortho-engine"
version = "0.1.0"
description = "QuickOrtho 처리 엔진 사이드카 (스캔, 미리보기, SfM, 정사투영)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pycolmap>=4.0",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quickortho-engine = "quickortho_engine.cli:main"

[tool.setuptools.packages.find]
include = ["quickortho_engine*"]
